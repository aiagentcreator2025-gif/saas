<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- subtle page-wide dot grid -->
    <pattern id="gridDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e9e9e9"/>
    </pattern>
    <!-- halftone dots used inside the tornado -->
    <pattern id="tornadoDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#cfcfcf"/>
      <circle cx="9" cy="6" r="1.7" fill="#bdbdbd"/>
      <circle cx="6" cy="10" r="1.4" fill="#b8b8b8"/>
      <circle cx="11" cy="11" r="0.9" fill="#d6d6d6"/>
    </pattern>
    <!-- tornado silhouette (approximate) -->
    <clipPath id="tornadoClip">
      <!-- top "cloud" -->
      <path d="M1325 170
               C1405 120 1580 120 1695 170
               C1795 215 1810 290 1750 335
               C1660 405 1465 405 1350 350
               C1255 305 1245 220 1325 170 Z"/>
      <!-- middle "cloud" -->
      <path d="M1370 420
               C1460 360 1645 360 1765 420
               C1860 470 1880 565 1810 625
               C1715 705 1510 705 1390 640
               C1300 590 1295 475 1370 420 Z"/>
      <!-- lower taper -->
      <path d="M1535 690
               C1635 640 1740 690 1715 785
               C1690 880 1600 930 1590 1015
               C1585 1055 1545 1065 1525 1030
               C1495 975 1505 920 1465 860
               C1415 785 1455 725 1535 690 Z"/>
    </clipPath>
  </defs>
  <!-- background -->
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect width="1920" height="1080" fill="url(#gridDots)"/>
  <!-- tornado -->
  <g clip-path="url(#tornadoClip)" opacity="0.9">
    <rect x="1200" y="90" width="760" height="1040" fill="url(#tornadoDots)"/>
    <!-- diagonal highlight stripes -->
    <path d="M1315 300 L1765 210 L1790 255 L1340 345 Z" fill="#ffffff" opacity="0.92"/>
    <path d="M1340 570 L1820 480 L1845 530 L1365 620 Z" fill="#ffffff" opacity="0.92"/>
    <path d="M1465 835 L1705 770 L1725 815 L1485 880 Z" fill="#ffffff" opacity="0.92"/>
  </g>
</svg>
